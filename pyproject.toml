[project]
name = "autoresearch"
version = "0.1.0"
description = "Autonomous pretraining research swarm"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kernels>=0.11.7",
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "requests>=2.32.0",
    "rustbpe>=0.1.0",
    "tiktoken>=0.11.0",
    "torch==2.9.1",
]

[tool.uv]
exclude-newer = "7 days"
constraint-dependencies = [
    "anyio>=4.14.2",
    "fsspec>=2026.6.0",
    "urllib3>=2.8.0",
    "setuptools>=83.0.0",
    "pillow>=12.3.0",
    "pygments>=2.20.0",
    "idna>=3.15",
    "requests>=2.33.0",
    "mistralai!=2.4.6",
    "guardrails-ai!=0.10.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
